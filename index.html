    <script>
      // Apply persisted theme synchronously to prevent FOUC.
      (function () {
        try {
          var stored = localStorage.getItem('preferences:theme')
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
          var theme = stored === 'dark' || stored === 'light' ? stored : prefersDark ? 'dark' : 'light'
          document.documentElement.setAttribute('data-theme', theme)
          var locale = localStorage.getItem('preferences:locale')
          if (locale === 'en' || locale === 'zh') {
            document.documentElement.setAttribute('lang', locale === 'en' ? 'en' : 'zh-CN')
          }
        } catch (_) {
          document.documentElement.setAttribute('data-theme', 'dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
